<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>饮之 · 鹿芽</title>
    <meta
      name="description"
      content="进来坐。茶还热着。"
    />
    <meta property="og:image" content="./assets/tearoom/hero-16x9.jpg" />
    <link rel="icon" type="image/png" href="./assets/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Noto Serif SC', serif;
        overflow: hidden;
        position: relative;
        width: 100vw;
        height: 100vh;
        background: #1a1512;
      }

      /* 视频背景容器 */
      .tearoom-background {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        overflow: hidden;
      }

      .tearoom-video,
      .tearoom-poster {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        min-width: 100%;
        min-height: 100%;
        width: auto;
        height: auto;
        object-fit: cover;
      }

      .tearoom-video {
        opacity: 0;
        transition: opacity 0.8s ease-in-out;
      }

      .tearoom-video.loaded {
        opacity: 1;
      }

      .tearoom-poster {
        z-index: 1;
        opacity: 1;
        transition: opacity 0.8s ease-in-out;
      }

      .tearoom-video.loaded ~ .tearoom-poster {
        opacity: 0;
        pointer-events: none;
      }

      /* 尊重减少动画偏好 */
      @media (prefers-reduced-motion: reduce) {
        .tearoom-video {
          display: none !important;
        }
        .tearoom-poster {
          opacity: 1 !important;
        }
      }

      /* 渐变覆盖层 */
      .tearoom-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          to bottom,
          rgba(26, 21, 18, 0.1) 0%,
          rgba(26, 21, 18, 0.3) 50%,
          rgba(26, 21, 18, 0.5) 100%
        );
        z-index: 2;
        pointer-events: none;
      }

      /* 内容容器 */
      .tearoom-content {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 10;
        padding: 2rem;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
        align-items: flex-start;
      }

      /* 文字样式 */
      .tearoom-greeting {
        color: #E7A0B4;
        font-size: 1.125rem;
        font-weight: 300;
        letter-spacing: 0.05em;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        margin: 0;
        line-height: 1.6;
      }

      /* 入口按钮 */
      .tearoom-enter {
        display: inline-block;
        padding: 0.75rem 2rem;
        color: #1a1512;
        background: rgba(231, 160, 180, 0.9);
        text-decoration: none;
        font-size: 1rem;
        font-weight: 400;
        letter-spacing: 0.1em;
        border-radius: 2px;
        transition: all 0.3s ease;
        box-shadow: 0 4px 16px rgba(231, 160, 180, 0.3);
        backdrop-filter: blur(8px);
      }

      .tearoom-enter:hover {
        background: rgba(231, 160, 180, 1);
        box-shadow: 0 6px 24px rgba(231, 160, 180, 0.5);
        transform: translateY(-2px);
      }

      .tearoom-enter:active {
        transform: translateY(0);
      }

      /* 品牌标记 */
      .tearoom-brand {
        position: fixed;
        top: 2rem;
        left: 2rem;
        z-index: 10;
        color: rgba(196, 165, 116, 0.8);
        font-size: 0.875rem;
        font-weight: 300;
        letter-spacing: 0.15em;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      }

      /* 响应式：平板和移动设备 */
      @media (max-width: 768px) {
        .tearoom-content {
          padding: 1.5rem;
          gap: 1.25rem;
        }

        .tearoom-greeting {
          font-size: 1rem;
        }

        .tearoom-enter {
          padding: 0.65rem 1.75rem;
          font-size: 0.9375rem;
        }

        .tearoom-brand {
          top: 1.5rem;
          left: 1.5rem;
          font-size: 0.8125rem;
        }
      }
    </style>
  </head>
  <body>
    <!-- 品牌标记 -->
    <div class="tearoom-brand">饮之</div>

    <!-- 视频背景 -->
    <div class="tearoom-background">
      <!-- 动态视频元素 -->
      <video
        id="tearoom-video"
        class="tearoom-video"
        autoplay
        muted
        playsinline
        preload="auto"
        aria-label="茶室氛围视频"
      >
        <!-- 视频源将由 JavaScript 动态设置 -->
      </video>
      
      <!-- 静态海报（视频加载前或失败时显示） -->
      <img
        id="tearoom-poster"
        class="tearoom-poster"
        alt="茶室窗边，鹿芽在等候"
      />
    </div>

    <!-- 渐变覆盖层 -->
    <div class="tearoom-overlay"></div>

    <!-- 内容 -->
    <div class="tearoom-content">
      <p class="tearoom-greeting">进来坐。茶还热着。</p>
      <a class="tearoom-enter" href="./luya-room/">鹿芽的家</a>
    </div>

    <script>
      // 视频池配置
      const VIDEO_POOLS = {
        landscape: [
          './assets/tearoom/loop-16x9-v1.mp4',
          './assets/tearoom/loop-16x9-v2.mp4',
          './assets/tearoom/loop-16x9-v3.mp4'
        ],
        portrait: [
          './assets/tearoom/loop-9x16-v1.mp4',
          './assets/tearoom/loop-9x16-v2.mp4',
          './assets/tearoom/loop-9x16-v3-from16.mp4',
          './assets/tearoom/loop-9x16-v3.mp4',
          './assets/tearoom/loop-9x16-v3b.mp4',
          './assets/tearoom/loop-9x16-v3c.mp4'
        ]
      };

      // 海报池配置
      const POSTER_POOLS = {
        landscape: [
          './assets/tearoom/hero-16x9.jpg',
          './assets/tearoom/hero-16x9-smile.jpg'
        ],
        portrait: [
          './assets/tearoom/hero-9x16.jpg',
          './assets/tearoom/hero-9x16-smile.jpg'
        ]
      };

      // 状态管理
      let currentOrientation = null;
      let lastPlayedVideo = null;
      let isReducedMotion = false;

      /**
       * 检测用户是否偏好减少动画
       */
      function checkReducedMotion() {
        if (window.matchMedia) {
          const mediaQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
          isReducedMotion = mediaQuery.matches;
          
          // 监听偏好变化
          mediaQuery.addEventListener('change', (e) => {
            isReducedMotion = e.matches;
            if (isReducedMotion) {
              pauseVideo();
            }
          });
        }
        return isReducedMotion;
      }

      /**
       * 检测当前视口方向
       */
      function detectOrientation() {
        const width = window.innerWidth;
        const height = window.innerHeight;
        
        // 优先使用宽度判断，768px 以下或竖屏用 portrait
        if (width <= 768 || height > width) {
          return 'portrait';
        }
        return 'landscape';
      }

      /**
       * 从池中随机选择一项，避免与上次相同
       */
      function randomPick(pool, lastItem = null) {
        if (pool.length === 1) {
          return pool[0];
        }
        
        // 过滤掉上次播放的项
        const availableItems = lastItem 
          ? pool.filter(item => item !== lastItem)
          : pool;
        
        const randomIndex = Math.floor(Math.random() * availableItems.length);
        return availableItems[randomIndex];
      }

      /**
       * 加载随机视频和海报
       */
      function loadRandomMedia() {
        const orientation = detectOrientation();
        currentOrientation = orientation;

        const videoElement = document.getElementById('tearoom-video');
        const posterElement = document.getElementById('tearoom-poster');

        // 选择随机视频
        const videoPool = VIDEO_POOLS[orientation];
        const selectedVideo = randomPick(videoPool, lastPlayedVideo);
        lastPlayedVideo = selectedVideo;

        // 选择随机海报
        const posterPool = POSTER_POOLS[orientation];
        const selectedPoster = randomPick(posterPool);

        // 设置海报
        posterElement.src = selectedPoster;

        // 如果用户偏好减少动画，只显示海报
        if (checkReducedMotion()) {
          videoElement.style.display = 'none';
          return;
        }

        // 设置视频源
        videoElement.innerHTML = `<source src="${selectedVideo}" type="video/mp4" />`;
        videoElement.load();

        // 视频加载完成
        videoElement.addEventListener('canplay', handleVideoCanPlay, { once: true });
        
        // 视频加载失败
        videoElement.addEventListener('error', handleVideoError, { once: true });

        // 视频结束时可选择加载下一个随机视频
        videoElement.addEventListener('ended', handleVideoEnded);
      }

      /**
       * 视频可播放时的处理
       */
      function handleVideoCanPlay() {
        const videoElement = document.getElementById('tearoom-video');
        videoElement.classList.add('loaded');
      }

      /**
       * 视频加载失败时的处理
       */
      function handleVideoError() {
        console.warn('视频加载失败，显示静态海报');
        const videoElement = document.getElementById('tearoom-video');
        videoElement.style.display = 'none';
      }

      /**
       * 视频结束时的处理（可选：加载下一个随机视频）
       */
      function handleVideoEnded() {
        const videoElement = document.getElementById('tearoom-video');
        
        // 移除 loaded 类以触发淡出
        videoElement.classList.remove('loaded');
        
        // 等待淡出完成后加载新视频
        setTimeout(() => {
          loadRandomMedia();
        }, 800);
      }

      /**
       * 暂停视频
       */
      function pauseVideo() {
        const videoElement = document.getElementById('tearoom-video');
        videoElement.pause();
        videoElement.style.display = 'none';
      }

      /**
       * 监听窗口大小变化，检测方向变化
       */
      function handleResize() {
        const newOrientation = detectOrientation();
        
        // 如果方向改变，重新加载媒体
        if (newOrientation !== currentOrientation) {
          const videoElement = document.getElementById('tearoom-video');
          videoElement.classList.remove('loaded');
          
          setTimeout(() => {
            loadRandomMedia();
          }, 800);
        }
      }

      // 初始化
      document.addEventListener('DOMContentLoaded', () => {
        // 加载初始随机媒体
        loadRandomMedia();

        // 监听窗口大小变化（防抖）
        let resizeTimer;
        window.addEventListener('resize', () => {
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(handleResize, 300);
        });
      });
    </script>
  </body>
</html>
